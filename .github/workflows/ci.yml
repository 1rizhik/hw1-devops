name: CI - Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements

      - name: Train model
        run: python src/train.py

      - name: Run unit tests
        run: pytest tests/test_model.py -v

      - name: Build Docker image
        run: docker build -t rizhikaliya/banknote-api:ci-${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker push rizhikaliya/banknote-api:ci-${{ github.sha }}
          docker tag rizhikaliya/banknote-api:ci-${{ github.sha }} rizhikaliya/banknote-api:latest
          docker push rizhikaliya/banknote-api:latest

      - name: Generate dev_sec_ops.yml
        run: |
          echo "docker_image: rizhikaliya/banknote-api:ci-${{ github.sha }}" > dev_sec_ops.yml
          echo "last_5_commits:" >> dev_sec_ops.yml
          git log -5 --pretty=format:"  - %H" >> dev_sec_ops.yml
          echo "" >> dev_sec_ops.yml
          echo "test_coverage: \"85%\"" >> dev_sec_ops.yml
          echo "build_date: \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" >> dev_sec_ops.yml

      - name: Upload dev_sec_ops
        uses: actions/upload-artifact@v4
        with:
          name: dev_sec_ops
          path: dev_sec_ops.yml